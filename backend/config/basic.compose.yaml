# basic.yml — non-sensitive configuration (docker-compose)
# Mounted to /app/config/basic.yml
version: 1.0.0

server:
  host: 0.0.0.0
  port: 8080
  mode: release
  read_timeout: 30s
  write_timeout: 30s
  max_header_bytes: 1048576

frontend:
  protocol: http
  host: frontend
  port: 3000

api:
  protocol: http
  host: backend
  port: 8080
  version: v1
  prefix: /api

log:
  level: info
  filename: ./logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true
  console: true
  json_format: false
  db:
    dsn: ./logs/log.db
    max_buffer: 1024
    batch_size: 100
    flush_every: 5s
    retention: 7

allow_origins:
  - "http://localhost"
  - "http://localhost:8080"
  - "http://localhost:8443"
  - "http://127.0.0.1:8080"
  - "http://127.0.0.1:8443"

attachment:
  upload_dir: uploads
  url_prefix: uploads
  allowed_ext: jpg,jpeg,png,gif,webp,mp4,webm,mp3
  max_size: 10485760

plugins:
  storage_dir: plugins
