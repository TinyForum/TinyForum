        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.BasicResponse'
      security:
      - ApiKeyAuth: []
      summary: 获取用户积分
      tags:
      - 管理员后台
    put:
      consumes:
      - application/json
      description: |-
        管理员可以通过此接口对指定用户的积分进行设置、增加或扣除操作。支持三种操作模式：<br>
        - **set**：将用户积分设置为指定值<br>
        - **add**：在现有积分基础上增加指定分数<br>
        - **subtract**：从现有积分中扣除指定分数<br>
        积分范围限制为 0 ~ 999999，且操作后积分不能为负数或超出上限。
      parameters:
      - description: 用户ID
        example: 10086
        in: path
        name: id
        required: true
        type: integer
      - description: 积分操作信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.AdminSetScoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/common.BasicResponse'
        "400":
          description: 请求参数错误（如积分范围非法、操作类型错误等）
          schema:
            $ref: '#/definitions/common.BasicResponse'
        "401":
          description: 未授权（缺少或无效的认证令牌）
          schema:
            $ref: '#/definitions/common.BasicResponse'
        "403":
          description: 禁止访问（当前管理员无权限操作该用户）
          schema:
            $ref: '#/definitions/common.BasicResponse'
        "500":
          description: 服务器内部错误（如数据库操作失败）
          schema:
            $ref: '#/definitions/common.BasicResponse'
      security:
      - ApiKeyAuth: []
      summary: 管理员设置用户积分
      tags:
      - 管理员后台
