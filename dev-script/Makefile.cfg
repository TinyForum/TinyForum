# ==============================================================================
# Makefile.cfg  —  YAML 配置文件管理（仅依赖 yq）
#
# 管理以下七个配置文件：
#   basic.yml, private.yml, risk_control.yml, postgres.yml, redis.yml, ai.yml, app.yml
#
# 依赖：yq（mikefarah/yq v4+）
#   Alpine:  apk add yq
#   手动:    wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
#            chmod +x /usr/local/bin/yq
# ==============================================================================

# ── 检测 yq ──────────────────────────────────────────────────────────────────
_CFG_YQ := $(shell command -v yq 2>/dev/null)

# yq 缺失时不再于解析期 $(error) 终止（那会阻断所有 make 目标，包括与配置无关的 help/build/test），
# 改为告警，并在依赖 yq 的目标上通过 .PHONY: _cfg_require_yq\n_cfg_require_yq:\n\t@:\n

# ==============================================================================
.PHONY: cfg-help cfg-init cfg-edit cfg-show cfg-check cfg-get cfg-validate

# @提示直接编辑现有文件（无 example 依赖）
cfg-init:
	@printf "$(YELLOW)[cfg] 无独立 example 文件，请直接编辑现有配置。$(NC)\n"
	@printf "      运行 $(GREEN)make cfg-edit FILE=basic$(NC) 开始编辑。\n"

# @编辑指定配置文件（FILE=basic|private|risk|postgres|redis|ai|app）
cfg-edit:
	@case "$(FILE)" in \
	  basic)    f="$(CFG_BASIC)"    ;; \
	  private)  f="$(CFG_PRIVATE)"  ;; \
	  risk)     f="$(CFG_RISK)"     ;; \
	  postgres) f="$(CFG_POSTGRES)" ;; \
	  redis)    f="$(CFG_REDIS)"    ;; \
	  ai)       f="$(CFG_AI)"       ;; \
	  app)      f="$(CFG_APP)"      ;; \
	  *) \
	    printf "$(RED)[cfg] 用法: make cfg-edit FILE=basic|private|risk|postgres|redis|ai|app$(NC)\n"; \
	    exit 1 ;; \
	esac; \
	[ -f "$$f" ] || { printf "$(YELLOW)[cfg] $$f 不存在，请先创建$(NC)\n"; exit 1; }; \
	$${EDITOR:-vi} "$$f"

# @打印从 YAML 读取到的配置值（FILE=basic|private|postgres|redis|risk|ai|app）
cfg-show: _cfg_require_yq
	@printf "$(BOLD)$(CYAN)=== YAML 配置值 ===$(NC)\n"
	@printf "$(GRAY)yq: $(_CFG_YQ)$(NC)\n\n"
	@case "$(FILE)" in \
	  basic|private|postgres|redis|risk|ai|app) sel="$(FILE)" ;; \
	  *) sel="all" ;; \
	esac; \
	\
	if [ "$$sel" = "all" ] || [ "$$sel" = "basic" ]; then \
	  printf "$(BOLD)[$(CFG_BASIC)]$(NC)\n"; \
	  printf "  $(BLUE)# 服务器$(NC)\n"; \
	  printf "  %-30s = %s\n" "server.port"          "$(CFG_SERVER_PORT)"; \
	  printf "  %-30s = %s\n" "server.mode"          "$(CFG_SERVER_MODE)"; \
	  printf "  $(BLUE)# 日志$(NC)\n"; \
	  printf "  %-30s = %s\n" "log.level"            "$(CFG_LOG_LEVEL)"; \
	  printf "  %-30s = %s\n" "log.filename"         "$(CFG_LOG_FILE)"; \
	  printf "  $(BLUE)# 附件$(NC)\n"; \
	  printf "  %-30s = %s\n" "attachment.upload_dir"  "$(CFG_ATTACH_DIR)"; \
	  printf "  %-30s = %s\n" "attachment.url_prefix"  "$(CFG_ATTACH_URL)"; \
	  printf "  %-30s = %s\n" "attachment.max_size"    "$(CFG_ATTACH_MAX)"; \
	  printf "  $(BLUE)# 插件$(NC)\n"; \
	  printf "  %-30s = %s\n" "plugins.storage_dir"    "$(CFG_PLUGINS_DIR)"; \
	  printf "\n"; \
	fi; \
	\
	if [ "$$sel" = "all" ] || [ "$$sel" = "private" ]; then \
	  printf "$(BOLD)[$(CFG_PRIVATE)]$(NC)\n"; \
	  printf "  $(BLUE)# 邮件$(NC)\n"; \
	  printf "  %-30s = %s\n" "email.host"           "$(CFG_EMAIL_HOST)"; \
	  printf "  %-30s = %s\n" "email.port"           "$(CFG_EMAIL_PORT)"; \
	  printf "  %-30s = %s\n" "email.username"       "$(CFG_EMAIL_USER)"; \
	  printf "  %-30s = %s\n" "email.from"           "$(CFG_EMAIL_FROM)"; \
	  printf "  $(BLUE)# JWT$(NC)\n"; \
	  printf "  %-30s = %s\n" "jwt.secret"           "$(CFG_JWT_SECRET)"; \
	  printf "  %-30s = %s\n" "jwt.expire"           "$(CFG_JWT_EXPIRE)"; \
	  printf "  %-30s = %s\n" "jwt.refresh_expire"   "$(CFG_JWT_REFRESH)"; \
	  printf "  %-30s = %s\n" "jwt.issuer"           "$(CFG_JWT_ISSUER)"; \
	  printf "  $(BLUE)# 管理员$(NC)\n"; \
	  printf "  %-30s = %s\n" "admin.email"          "$(CFG_ADMIN_EMAIL)"; \
	  printf "  %-30s = %s\n" "admin.username"       "$(CFG_ADMIN_USER)"; \
	  printf "\n"; \
	fi; \
	\
	if [ "$$sel" = "all" ] || [ "$$sel" = "postgres" ]; then \
	  printf "$(BOLD)[$(CFG_POSTGRES)]$(NC)\n"; \
	  printf "  %-30s = %s\n" "host"                 "$(CFG_DB_HOST)"; \
	  printf "  %-30s = %s\n" "port"                 "$(CFG_DB_PORT)"; \
	  printf "  %-30s = %s\n" "user"                 "$(CFG_DB_USER)"; \
	  printf "  %-30s = %s\n" "password"             "$(CFG_DB_PASSWORD)"; \
	  printf "  %-30s = %s\n" "dbname"               "$(CFG_DB_NAME)"; \
	  printf "  %-30s = %s\n" "sslmode"              "$(CFG_DB_SSLMODE)"; \
	  printf "\n"; \
	fi; \
	\
	if [ "$$sel" = "all" ] || [ "$$sel" = "redis" ]; then \
	  printf "$(BOLD)[$(CFG_REDIS)]$(NC)\n"; \
	  printf "  %-30s = %s\n" "host"                 "$(CFG_REDIS_HOST)"; \
	  printf "  %-30s = %s\n" "port"                 "$(CFG_REDIS_PORT)"; \
	  printf "  %-30s = %s\n" "db"                   "$(CFG_REDIS_DB)"; \
	  printf "\n"; \
	fi; \
	\
	if [ "$$sel" = "all" ] || [ "$$sel" = "risk" ]; then \
	  printf "$(BOLD)[$(CFG_RISK)]$(NC)\n"; \
	  printf "  %-30s = %s\n" "rate_limit.enabled"   "$(CFG_RATE_ENABLED)"; \
	  printf "  %-30s = %s\n" "content_check.enabled" "$(CFG_CONTENT_ENABLED)"; \
	  printf "\n"; \
	fi; \
	\
	if [ "$$sel" = "all" ] || [ "$$sel" = "ai" ]; then \
	  printf "$(BOLD)[$(CFG_AI)]$(NC)\n"; \
	  printf "  %-30s = %s\n" "enable"               "$(CFG_AI_ENABLE)"; \
	  printf "  %-30s = %s\n" "provider"             "$(CFG_AI_PROVIDER)"; \
	  printf "  %-30s = %s\n" "config.model"         "$(CFG_AI_MODEL)"; \
	  printf "  %-30s = %s\n" "config.base-url"      "$(CFG_AI_BASEURL)"; \
	  printf "\n"; \
	fi; \
	\
	if [ "$$sel" = "all" ] || [ "$$sel" = "app" ]; then \
	  printf "$(BOLD)[$(CFG_APP)]$(NC)\n"; \
	  printf "  %-30s = %s\n" "debug"                "$(CFG_APP_DEBUG)"; \
	  printf "\n"; \
	fi

# @检查所有配置文件是否存在
cfg-check:
	@printf "$(BOLD)[cfg] 检查配置文件...$(NC)\n"
	@failed=0; \
	for f in "$(CFG_BASIC)" "$(CFG_PRIVATE)" "$(CFG_RISK)" "$(CFG_POSTGRES)" "$(CFG_REDIS)" "$(CFG_AI)" "$(CFG_APP)"; do \
	  if [ -f "$$f" ]; then \
	    printf "  $(GREEN)✓ $$f$(NC)\n"; \
	  else \
	    printf "  $(RED)✗ $$f  （缺失）$(NC)\n"; \
	    failed=1; \
	  fi; \
	done; \
	printf "\n$(BOLD)[cfg] yq 路径:$(NC) $(_CFG_YQ)\n"; \
	printf "$($(_CFG_YQ) --version 2>/dev/null)\n\n"; \
	if [ $$failed -eq 1 ]; then \
	  printf "$(RED)[cfg] ❌ 有配置文件缺失$(NC)\n"; exit 1; \
	else \
	  printf "$(GREEN)[cfg] ✅ 所有配置文件均存在$(NC)\n"; \
	fi

# @校验关键配置项格式
cfg-validate: _cfg_require_yq
	@printf "$(BOLD)[cfg] 校验配置项格式...$(NC)\n"
	@failed=0; \
	_ok()   { printf "  $(GREEN)✓ %-35s = %s$(NC)\n"          "$$1" "$$2"; }; \
	_fail() { printf "  $(RED)✗ %-35s = %s  (%s)$(NC)\n"      "$$1" "$$2" "$$3"; failed=1; }; \
	_warn() { printf "  $(YELLOW)! %-35s = %s  (%s)$(NC)\n"   "$$1" "$$2" "$$3"; }; \
	\
	port="$(CFG_SERVER_PORT)"; \
	if printf '%s' "$$port" | grep -qE '^[0-9]+$$' && [ "$$port" -ge 1 ] && [ "$$port" -le 65535 ]; then \
	  _ok "basic → server.port" "$$port"; \
	else _fail "basic → server.port" "$$port" "应为 1–65535"; fi; \
	\
	mode="$(CFG_SERVER_MODE)"; \
	if printf '%s' "$$mode" | grep -qE '^(debug|release|test)$$'; then \
	  _ok "basic → server.mode" "$$mode"; \
	else _fail "basic → server.mode" "$$mode" "应为 debug/release/test"; fi; \
	\
	lvl="$(CFG_LOG_LEVEL)"; \
	if printf '%s' "$$lvl" | grep -qE '^(debug|info|warn|error)$$'; then \
	  _ok "basic → log.level" "$$lvl"; \
	else _fail "basic → log.level" "$$lvl" "应为 debug/info/warn/error"; fi; \
	\
	dbport="$(CFG_DB_PORT)"; \
	if printf '%s' "$$dbport" | grep -qE '^[0-9]+$$' && [ "$$dbport" -ge 1 ] && [ "$$dbport" -le 65535 ]; then \
	  _ok "postgres → port" "$$dbport"; \
	else _fail "postgres → port" "$$dbport" "应为 1–65535"; fi; \
	\
	secret="$(CFG_JWT_SECRET)"; slen=$${#secret}; \
	if [ "$$slen" -ge 32 ]; then \
	  _ok "private → jwt.secret (len=$$slen)" "***"; \
	else _fail "private → jwt.secret" "len=$$slen" "长度应 ≥ 32"; fi; \
	\
	expire="$(CFG_JWT_EXPIRE)"; \
	if printf '%s' "$$expire" | grep -qE '^[0-9]+(h|m|s)$$'; then \
	  _ok "private → jwt.expire" "$$expire"; \
	else _warn "private → jwt.expire" "$$expire" "建议格式如 24h / 30m"; fi; \
	\
	if [ "$$failed" = "1" ]; then \
	  printf "\n$(RED)[cfg] ❌ 校验失败，请修正配置文件$(NC)\n"; exit 1; \
	else \
	  printf "\n$(GREEN)[cfg] ✅ 校验通过$(NC)\n"; \
	fi

# @读取单个配置项（FILE=basic|private|risk|postgres|redis|ai|app  KEY=dotted.key）
cfg-get: _cfg_require_yq
	@[ -n "$(FILE)" ] && [ -n "$(KEY)" ] || { \
	  printf "$(RED)[cfg] 用法: make cfg-get FILE=basic|private|... KEY=dotted.key$(NC)\n"; exit 1; }
	@case "$(FILE)" in \
	  basic)    f="$(CFG_BASIC)"    ;; \
	  private)  f="$(CFG_PRIVATE)"  ;; \
	  risk)     f="$(CFG_RISK)"     ;; \
	  postgres) f="$(CFG_POSTGRES)" ;; \
	  redis)    f="$(CFG_REDIS)"    ;; \
	  ai)       f="$(CFG_AI)"       ;; \
	  app)      f="$(CFG_APP)"      ;; \
	  *) printf "$(RED)[cfg] FILE 参数错误$(NC)\n"; exit 1 ;; \
	esac; \
	[ -f "$$f" ] || { printf "$(RED)[cfg] 文件不存在: $$f$(NC)\n"; exit 1; }; \
	val=$$($(_CFG_YQ) e '.$(KEY) // ""' "$$f" 2>/dev/null); \
	[ -n "$$val" ] || { printf "$(YELLOW)[cfg] '$(KEY)' 不存在或值为空$(NC)\n"; exit 1; }; \
	printf "$(GREEN)$(KEY)=$$val$(NC)\n"

# @读取 basic.yaml 中的 version 字段
version:
	@$(MAKE) -s cfg-get FILE=basic KEY=version

# @显示帮助
cfg-help:
	@$(MAKE) -s _print_help SELF_MAKEFILE_PATH='$(MAKEFILE_CFG_PATH)'
	@echo ""