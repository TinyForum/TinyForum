# basic.yml — non-sensitive configuration
# Generated by TinyForum setup script
# DO NOT EDIT MANUALLY — run 'make init-dev' to regenerate
version: 1.0.0

server:
  host: localhost
  port: 8080
  mode: debug
  read_timeout: 30s
  write_timeout: 30s
  max_header_bytes: 1048576

frontend:
  protocol: http
  host: localhost
  port: 3000

api:
  protocol: http
  host: localhost
  port: 8080
  version: v1
  prefix: /api

log:
  level: info
  filename: ./logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true
  console: true
  json_format: false
  db:
    dsn: ./logs/log.db
    max_buffer: 1024
    batch_size: 100
    flush_every: 5s
    retention: 7

allow_origins:
  - "http://localhost:3000"
  - "http://127.0.0.1:3000"
  - "http://localhost:8080"
  - "http://127.0.0.1:8080"

attachment:
  upload_dir: attachments
  url_prefix: attachment
  allowed_ext: png,jpg,jpeg,gif,mp4,webm,mp3,avi,mkv
  max_size: 10485760

plugins:
  storage_dir: plugins
